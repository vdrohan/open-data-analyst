[project]
name = "open-data-analyst"
version = "0.1.0"
description = "Natural-language analyst agent over Canadian housing data: Claude writes read-only SQL against DuckDB and shows its work."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = []

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8", "pre-commit>=4"]

[build-system]
requires = ["uv_build>=0.8,<0.12"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
